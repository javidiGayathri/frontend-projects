<html>
    <head>
        <title>Form validation</title>
        <script>
            function validationform()
            {
                const email=document.getElementById("email").value;
                if (!email.includes("0") || !email.includes(".")){
                    alert("Invalid email address.");
                    return false;
                }
                const password=document.getElementByID("password").value;
                const confirmpassword=document.getElementsById("confirmpassword").value;
                if (password.length<8){
                    alert("password must be at least 8 charcters long.");
                    return false;
                }
                if (password !== confirmpassword){
                    alert("password do not match");
                    return false;
                }
                return true;
            }
            
        </script>
        <body>
            <style>
                
body {
    font-family: Arial, sans-serif;
    background-color:lightcoral;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100v;
}

.form-container {
    background: #fff;
    padding: 20px 30px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px;
}


h2 {
    text-align: center;
    color:#333;
    font-weight: bold;
    font-size: 50px;

}


.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color:gray;
    padding:10px;
    font-size: 40px;
}


input {
    width: 100%;
    padding: 20px;
    border: 2px solid #ddd;
    border-radius: 4px;
    font-size: 20px;
    border-color: #333;
}

input:focus {
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 4px rgba(0, 123, 255, 0.2);
}

.error-message {
    font-size: 12px;
    color: red;
    margin-top: 5px;
    display: none; 
}


button {
    width: 50px;
    height:50px;
    padding: 10px 20px;
    background: #007bff;
    border: none;
    border-radius: 4px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}
.view_btn{
height:50px;
width:50px;
justify-content: center;
}

            </style>
            <form>
                <form id="registrationform" onsubmit="return validationform()">
                    <h2 align="center">User Registration Form</h2>
                    <table align="center">
                        <tr>
                            <td>
                                <label for="firstname">First Name:</label></td>
                                <td> <input type="text" id="FirstName" name="FirstName" required><br><br></td></tr>
                                <tr>
                                    <td> <label for="email">Email:</label></td>
                                    <td> <input type="email" id="email" name="email" required><br><br></td></tr>

                                <tr> 
                                    <td> <label for="phone number">phone number:</label></td>
                                    <td> <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required title="10 digits only"><br><br></td>
                                </tr>
                            <tr>
                                <td>
                                    <label for="password">password:</label></td>
                                
<td><input type="password" id="password" name="password" required><br><br></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="Confirmpassword">Confirmpassword:</label>
                                </td>
                                <td> <input type="password" id="confirmpassword" name="password" required><br><br></td>
                            </tr>
                            <tr>
                                <td> <label for="Address">Address:</label></td>
                                <td> <textarea type="Address" id="Address" name="Address" rows="4" cols="50" required></textarea><br><br></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="city">city:</label>
                                </td>
                                <td> <input type="city" id="city" name="city" required><br><br></td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="state">state:</label>
                                </td> 
                                <td> <input type="state" id="state" name="state" required><br><br></td>
            
                            </tr>
                            <tr>
                                <td>
                                    <label for="zipcode">zipcode:</label>
                                </td>
                                <td> <input id="zip" name="zip" required><br><br></td>
                            </tr>
                            <tr>
                                <td>
                            
                            
                                    <label for="country">country:</label>
                                    <select id="country" name="country" required>
                                       <option value="">select country</option>
                                       <option value="India">India</option>
                                       <option value="USA">USA</option>
                                       <option value="UK">UK</option>
                                    </select><br><br>
                                    </td>

                                </tr>
                                <tr>
                                    <div class="view_btn">
                                    <td colspan="1">
                                        <input type="submit" value="submit">
                                    </td>
                                    </div>
                                </tr>
                                

                        
                            </table>
            </form>
        </body>
    </head>
</html>
